<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-soft: #1f2937;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --operator: #f59e0b;
            --secondary: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #020817, #111827 40%, #1f2937);
            color: var(--text);
        }

        .calculator {
            width: min(92vw, 380px);
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
            padding: 20px;
        }

        .display {
            min-height: 90px;
            display: flex;
            align-items: end;
            justify-content: flex-end;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 18px;
            margin-bottom: 18px;
            padding: 16px 18px;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            word-break: break-all;
            overflow: hidden;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 14px;
            min-height: 62px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.12s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        button:active {
            transform: translateY(0);
        }

        .number {
            background: var(--panel-soft);
            color: var(--text);
        }

        .operator {
            background: var(--operator);
            color: #111827;
        }

        .secondary {
            background: var(--secondary);
            color: var(--text);
        }

        .equals {
            background: var(--accent);
            color: white;
            grid-column: span 2;
        }

        .equals:hover {
            background: var(--accent-dark);
        }
    </style>
</head>
<body>
    <div class="calculator" aria-label="Calculator">
        <div id="display" class="display" aria-live="polite">0</div>
        <div class="buttons">
            <button class="secondary" data-action="clear">AC</button>
            <button class="secondary" data-action="delete">DEL</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="+">+</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="equals" data-action="equals">=</button>

            <button class="number" data-value="0" style="grid-column: span 2;">0</button>
            <button class="number" data-value=".">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let currentInput = '';
        let previousValue = null;
        let operator = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.textContent = currentInput === '' ? '0' : currentInput;
        }

        function handleNumber(value) {
            if (shouldResetDisplay) {
                currentInput = '';
                shouldResetDisplay = false;
            }

            if (value === '.' && currentInput.includes('.')) {
                return;
            }

            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }

            updateDisplay();
        }

        function performCalculation() {
            if (previousValue === null || operator === null || currentInput === '') {
                return;
            }

            const secondValue = Number(currentInput);
            let result;

            switch (operator) {
                case '+':
                    result = previousValue + secondValue;
                    break;
                case '-':
                    result = previousValue - secondValue;
                    break;
                case '*':
                    result = previousValue * secondValue;
                    break;
                case '/':
                    result = secondValue === 0 ? 'Error' : previousValue / secondValue;
                    break;
                default:
                    return;
            }

            currentInput = result.toString();
            previousValue = null;
            operator = null;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function handleOperator(nextOperator) {
            if (currentInput === '' && previousValue === null) {
                return;
            }

            if (operator !== null && currentInput !== '') {
                performCalculation();
            }

            previousValue = Number(currentInput || previousValue);
            operator = nextOperator;
            currentInput = '';
            shouldResetDisplay = false;
        }

        function clearCalculator() {
            currentInput = '';
            previousValue = null;
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteDigit() {
            if (shouldResetDisplay) {
                clearCalculator();
                return;
            }

            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        document.querySelectorAll('.number').forEach((button) => {
            button.addEventListener('click', () => {
                handleNumber(button.dataset.value);
            });
        });

        document.querySelectorAll('.operator').forEach((button) => {
            button.addEventListener('click', () => {
                handleOperator(button.dataset.value);
            });
        });

        document.querySelector('[data-action="clear"]').addEventListener('click', clearCalculator);
        document.querySelector('[data-action="delete"]').addEventListener('click', deleteDigit);
        document.querySelector('[data-action="equals"]').addEventListener('click', () => {
            if (operator !== null && currentInput !== '') {
                performCalculation();
            }
        });

        document.addEventListener('keydown', (event) => {
            const { key } = event;

            if (/^[0-9]$/.test(key)) {
                handleNumber(key);
            } else if (['+', '-', '*', '/'].includes(key)) {
                handleOperator(key);
            } else if (key === '.') {
                handleNumber('.');
            } else if (key === 'Enter' || key === '=') {
                if (operator !== null && currentInput !== '') {
                    performCalculation();
                }
            } else if (key === 'Backspace') {
                deleteDigit();
            } else if (key.toLowerCase() === 'c') {
                clearCalculator();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
